<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Directory</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --card-border: #2a2e37;
    --text: #e8eaed;
    --text-dim: #9aa0a8;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 30px;
    font-weight: 600;
  }
  #status {
    text-align: center;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .grid {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .link-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .favicon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    background: #fff;
    object-fit: contain;
  }
  .info {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .name {
    font-weight: 600;
    font-size: 0.98rem;
  }
  .url {
    font-size: 0.82rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<h1>Link Directory</h1>
<p id="status">Loading links…</p>
<div class="grid" id="grid"></div>

<script>
  const JSON_FILE = "links.json";

  async function loadLinks() {
    const status = document.getElementById("status");
    const grid = document.getElementById("grid");

    try {
      const res = await fetch(JSON_FILE);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const links = await res.json();

      status.remove();

      links.forEach(({ name, url }) => {
        let hostname;
        try {
          hostname = new URL(url).hostname;
        } catch {
          hostname = "";
        }

        const card = document.createElement("a");
        card.className = "link-card";
        card.href = url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        const favicon = document.createElement("img");
        favicon.className = "favicon";
        favicon.src = `https://www.google.com/s2/favicons?sz=64&domain=${hostname}`;
        favicon.alt = "";
        favicon.onerror = () => { favicon.style.visibility = "hidden"; };

        const info = document.createElement("div");
        info.className = "info";

        const nameEl = document.createElement("span");
        nameEl.className = "name";
        nameEl.textContent = name;

        const urlEl = document.createElement("span");
        urlEl.className = "url";
        urlEl.textContent = url;

        info.append(nameEl, urlEl);
        card.append(favicon, info);
        grid.appendChild(card);
      });
    } catch (err) {
      status.textContent = "Couldn't load links.json — " + err.message;
    }
  }

  loadLinks();
</script>

</body>
</html>
